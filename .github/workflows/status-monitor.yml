name: M4I Status Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/status-monitor.yml"
      - "scripts/status_monitor.py"

permissions:
  contents: write

concurrency:
  group: m4i-status-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load previous 72-hour status data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin status-data:refs/remotes/origin/status-data || true
          if git show origin/status-data:status.json > /tmp/status-prev.json 2>/dev/null; then
            echo "Loaded previous status window"
          else
            printf '{}\n' > /tmp/status-prev.json
            echo "Starting a new status window"
          fi

      - name: Check M4I services
        run: |
          python3 scripts/status_monitor.py --previous /tmp/status-prev.json --output /tmp/status.json
          python3 -m json.tool /tmp/status.json >/dev/null

      - name: Publish central status feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "m4i-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan status-data-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/status.json ./status.json
          printf '# M4I Status Data\n\nMachine-generated monitoring data for the public portfolio status center.\n' > README.md
          git add status.json README.md
          git commit -m "status: update service health"
          git push --force origin HEAD:status-data
