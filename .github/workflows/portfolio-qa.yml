name: Portfolio QA

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "script-v3.js"
      - "v5.js"
      - "v5.css"
      - "scripts/status_monitor.py"
      - ".github/workflows/portfolio-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check script-v3.js
          node --check v5.js
      - name: Python monitor syntax
        run: python3 -m py_compile scripts/status_monitor.py
      - name: Portfolio structure
        run: |
          test -s index.html
          test -s styles.css
          test -s v5.css
          grep -q 'id="projects"' index.html
          grep -q 'id="status"' index.html
          grep -q 'status-data/status.json' v5.js
          grep -q 'repeat(72' v5.css
